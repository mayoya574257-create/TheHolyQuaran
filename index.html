<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Al-Noor Quran Reader | Base Blockchain</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Amiri', 'Traditional Arabic', 'Tahoma', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b2f9e 0%, #1a4fc3 40%, #3a7bd5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* main glassmorphic card */
        .quran-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(3px);
            border-radius: 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.3) inset;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* header */
        .header {
            background: #0a2472;
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 3px solid #ffd966;
        }

        .header h1 {
            color: #f9f3d9;
            font-size: 2rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header h1 span:first-child {
            font-size: 2.2rem;
        }

        .badge {
            background: #ffcd4a;
            color: #0a2472;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 40px;
            padding: 0.25rem 1rem;
            display: inline-block;
            margin-top: 10px;
        }

        /* main content */
        .content {
            padding: 2rem 2rem 2rem 2rem;
        }

        /* connect / action zone */
        .action-panel {
            background: #eef3ff;
            border-radius: 40px;
            padding: 1.2rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.05);
        }

        .wallet-status {
            background: white;
            border-radius: 60px;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #0f3b9e;
            font-family: monospace;
            word-break: break-all;
        }

        .btn-primary {
            background: linear-gradient(95deg, #1e4dd4, #0e3490);
            border: none;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 6px 0 #071b4f;
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #071b4f;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            transform: translateY(0);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #2c5bb0;
            border: none;
            color: white;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary:hover {
            background: #18458b;
        }

        /* verses container */
        .verses-container {
            background: #fefcf0;
            border-radius: 36px;
            padding: 1.8rem;
            margin: 1.5rem 0;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid #ffecb3;
        }

        .verse-item {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px dashed #cbd5e1;
        }

        .verse-item:last-child {
            border-bottom: none;
        }

        .arabic {
            font-size: 1.9rem;
            line-height: 1.5;
            font-weight: 500;
            text-align: right;
            font-family: 'Amiri', 'Traditional Arabic', 'Times New Roman', serif;
            color: #1e2f4b;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .translation {
            font-size: 1rem;
            color: #2d496c;
            background: #f0f4fa;
            padding: 0.5rem 1rem;
            border-radius: 24px;
            margin-top: 0.3rem;
            border-left: 5px solid #0a2472;
        }

        .listen-btn {
            background: #0a6b5e;
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 60px;
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
        }

        .listen-btn:hover {
            background: #0e8a78;
            transform: scale(1.02);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: #0b2f9e;
            font-weight: bold;
        }

        .tx-status {
            font-size: 0.9rem;
            margin-top: 12px;
            color: #1557b0;
            font-weight: 500;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.75rem;
            background: #dce5f5;
            color: #1f3a6b;
        }

        @media (max-width: 680px) {
            .arabic { font-size: 1.4rem; }
            .btn-primary { padding: 0.6rem 1.4rem; font-size: 1rem; }
            .content { padding: 1.5rem; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.1/dist/ethers.umd.min.js"></script>
</head>
<body>
<div class="quran-card">
    <div class="header">
        <h1>
            <span>📖</span> Al-Noor Quran Reader
        </h1>
        <div class="badge">⚡ powered by Base Blockchain | Mashari Rashed Audio</div>
    </div>
    <div class="content">
        <div class="action-panel">
            <div class="wallet-status" id="walletStatus">⛓️ Not Connected</div>
            <button class="btn-primary" id="readVersesBtn">✨ Read 3 Verses ✨</button>
        </div>

        <!-- verses display area -->
        <div id="versesDisplay" style="display: none;">
            <div class="verses-container" id="versesList"></div>
            <button class="listen-btn" id="listenBtn">🎧 Listen to Verses (Mashari Rashed)</button>
        </div>
        <div id="loadingMessage" class="loading" style="display: none;">🕋 Processing transaction & fetching revelation...</div>
        <div id="txStatus" class="tx-status"></div>
    </div>
    <footer>🕊️ Consecutive verses from Juz 1 to 29 | On-chain reading record | Each read is unique</footer>
</div>

<script>
    // -----------------------------------------------
    // 1. CONTRACT DETAILS (Base Mainnet)
    // -----------------------------------------------
    const CONTRACT_ADDRESS = "0x1fc3d17FAD3a9169Fad8001329b1e9EBbfe4016C";
    const CONTRACT_ABI = [
        "function readThreeVerses() external",
        "function totalReads() view returns (uint256)",
        "event VersesRead(address indexed reader, uint256 timestamp, uint256 totalReads)"
    ];
    const BASE_CHAIN_ID = "0x2105"; // 8453 in hex
    const BASE_RPC = "https://mainnet.base.org";

    // Verified owner address (as per requirement)
    const VERIFIED_OWNER = "0x70738995DA09Ef2886A1C69bBD099D5190899214";

    // -----------------------------------------------
    // 2. QURAN DATASET: BUILD ALL VERSES FROM JUZ 1 -> 29 (consecutive ayah list with surah & ayah)
    //    Using standard Juz boundaries + ayah counts. We'll generate a versesList of objects { surah, ayah, juz }
    //    Then triplets will be selected consecutively from this master list, ensuring they belong to same surah.
    // -----------------------------------------------
    
    // Ayah counts per surah (114 surahs)
    const AYAH_COUNTS = [
        7, 286, 200, 176, 120, 165, 206, 75, 129, 109, 123, 111, 43, 52, 99, 128, 111, 110, 98, 135, 112, 78, 118, 64, 77,
        227, 93, 88, 69, 60, 34, 30, 73, 54, 45, 83, 182, 88, 75, 85, 54, 53, 89, 59, 37, 35, 38, 29, 18, 45, 60, 49, 62,
        55, 78, 96, 29, 22, 24, 13, 14, 11, 11, 18, 12, 12, 30, 52, 52, 44, 28, 28, 20, 56, 40, 31, 50, 40, 46, 42, 29,
        19, 36, 25, 22, 17, 19, 26, 30, 20, 15, 21, 11, 8, 8, 19, 5, 8, 8, 11, 11, 8, 3, 9, 5, 4, 7, 3, 6, 3, 5, 4, 5, 6
    ];
    
    // Juz boundaries (first 29 Juz) : each element = { startSurah, startAyah, endSurah, endAyah }
    // Standard boundaries verified from Hafs recitation. (covers Juz 1 to 29)
    const JUZ_BOUNDARIES = [
        { startSurah: 1, startAyah: 1, endSurah: 2, endAyah: 141 },    // juz1
        { startSurah: 2, startAyah: 142, endSurah: 2, endAyah: 252 },   // juz2
        { startSurah: 2, startAyah: 253, endSurah: 3, endAyah: 92 },     // juz3
        { startSurah: 3, startAyah: 93, endSurah: 4, endAyah: 23 },      // juz4
        { startSurah: 4, startAyah: 24, endSurah: 4, endAyah: 147 },     // juz5
        { startSurah: 4, startAyah: 148, endSurah: 5, endAyah: 81 },     // juz6
        { startSurah: 5, startAyah: 82, endSurah: 6, endAyah: 110 },     // juz7
        { startSurah: 6, startAyah: 111, endSurah: 7, endAyah: 87 },     // juz8
        { startSurah: 7, startAyah: 88, endSurah: 8, endAyah: 40 },      // juz9
        { startSurah: 8, startAyah: 41, endSurah: 9, endAyah: 92 },      // juz10
        { startSurah: 9, startAyah: 93, endSurah: 11, endAyah: 5 },      // juz11
        { startSurah: 11, startAyah: 6, endSurah: 12, endAyah: 52 },     // juz12
        { startSurah: 12, startAyah: 53, endSurah: 14, endAyah: 52 },    // juz13
        { startSurah: 15, startAyah: 1, endSurah: 16, endAyah: 128 },    // juz14
        { startSurah: 17, startAyah: 1, endSurah: 18, endAyah: 74 },     // juz15
        { startSurah: 18, startAyah: 75, endSurah: 20, endAyah: 135 },    // juz16
        { startSurah: 21, startAyah: 1, endSurah: 22, endAyah: 78 },     // juz17
        { startSurah: 23, startAyah: 1, endSurah: 25, endAyah: 20 },     // juz18
        { startSurah: 25, startAyah: 21, endSurah: 27, endAyah: 55 },    // juz19
        { startSurah: 27, startAyah: 56, endSurah: 29, endAyah: 45 },    // juz20
        { startSurah: 29, startAyah: 46, endSurah: 33, endAyah: 30 },    // juz21
        { startSurah: 33, startAyah: 31, endSurah: 36, endAyah: 27 },    // juz22
        { startSurah: 36, startAyah: 28, endSurah: 39, endAyah: 31 },    // juz23
        { startSurah: 39, startAyah: 32, endSurah: 41, endAyah: 46 },    // juz24
        { startSurah: 41, startAyah: 47, endSurah: 45, endAyah: 37 },    // juz25
        { startSurah: 46, startAyah: 1, endSurah: 51, endAyah: 30 },     // juz26
        { startSurah: 51, startAyah: 31, endSurah: 57, endAyah: 29 },    // juz27
        { startSurah: 58, startAyah: 1, endSurah: 66, endAyah: 12 },     // juz28
        { startSurah: 67, startAyah: 1, endSurah: 77, endAyah: 50 }      // juz29 (ends at Surah Mursalat 77:50)
    ];
    
    // Build master verse list (surah, ayah) for Juz 1 to 29 inclusive
    function buildVersesListForJuz1To29() {
        let allVerses = []; // each entry { surah, ayah, globalIdx }
        for (let j = 0; j < JUZ_BOUNDARIES.length; j++) {
            const boundary = JUZ_BOUNDARIES[j];
            // iterate over surahs between start and end
            for (let surah = boundary.startSurah; surah <= boundary.endSurah; surah++) {
                const maxAyah = AYAH_COUNTS[surah-1];
                let startAyah = (surah === boundary.startSurah) ? boundary.startAyah : 1;
                let endAyah = (surah === boundary.endSurah) ? boundary.endAyah : maxAyah;
                for (let ayah = startAyah; ayah <= endAyah; ayah++) {
                    allVerses.push({ surah, ayah, juz: j+1 });
                }
            }
        }
        return allVerses;
    }
    
    const MASTER_VERSES = buildVersesListForJuz1To29();   // total verses from Juz1 to Juz29 (approx 5400+)
    console.log(`Loaded ${MASTER_VERSES.length} total verses from Juz 1-29`);
    
    // Helper: check if verses at idx, idx+1, idx+2 are all within same surah
    function isValidTriplet(startIdx) {
        if (startIdx + 2 >= MASTER_VERSES.length) return false;
        const surah1 = MASTER_VERSES[startIdx].surah;
        const surah2 = MASTER_VERSES[startIdx+1].surah;
        const surah3 = MASTER_VERSES[startIdx+2].surah;
        return (surah1 === surah2 && surah2 === surah3);
    }
    
    // Get random triplet (consecutive 3 verses within same surah)
    // Large pool of possibilities -> rare repeats
    function getRandomConsecutiveTriplet() {
        let maxAttempts = 100;
        let randomStart;
        do {
            randomStart = Math.floor(Math.random() * (MASTER_VERSES.length - 2));
            maxAttempts--;
            if (maxAttempts <= 0) break;
        } while (!isValidTriplet(randomStart));
        // fallback: linear scan for any valid triplet (safety)
        if (!isValidTriplet(randomStart)) {
            for (let i = 0; i < MASTER_VERSES.length - 2; i++) {
                if (isValidTriplet(i)) {
                    randomStart = i;
                    break;
                }
            }
        }
        return [
            MASTER_VERSES[randomStart],
            MASTER_VERSES[randomStart+1],
            MASTER_VERSES[randomStart+2]
        ];
    }
    
    // -----------------------------------------------
    // 3. Fetch Arabic + English translation from alquran.cloud API
    // -----------------------------------------------
    async function fetchVerseText(surah, ayah) {
        // using two editions: quran-uthmani (Arabic) and en.sahih (English)
        const url = `https://api.alquran.cloud/v1/ayah/${surah}:${ayah}/editions/quran-uthmani,en.sahih`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            if (data.code === 200 && data.data.length >= 2) {
                const arabic = data.data[0].text;
                const english = data.data[1].text;
                return { arabic, english };
            } else {
                throw new Error("API error");
            }
        } catch (err) {
            console.warn("fetch error, fallback text", err);
            return { arabic: `[${surah}:${ayah}]`, english: "Translation temporarily unavailable" };
        }
    }
    
    // Display verses on UI after getting text
    async function displayTripletVerses(versesArray) {
        const versesContainer = document.getElementById("versesList");
        versesContainer.innerHTML = '<div class="loading">📖 Loading revelation...</div>';
        let finalHtml = '';
        for (let i = 0; i < versesArray.length; i++) {
            const v = versesArray[i];
            const texts = await fetchVerseText(v.surah, v.ayah);
            finalHtml += `
                <div class="verse-item">
                    <div class="arabic">${texts.arabic}</div>
                    <div class="translation">✨ ${texts.english}</div>
                    <div style="font-size:0.75rem; color:#4f6f8f; margin-top:5px;">${v.surah}:${v.ayah} • Juz ${v.juz}</div>
                </div>
            `;
        }
        versesContainer.innerHTML = finalHtml;
        // Store current triplet globally for audio player
        window.currentAudioTriplet = versesArray;
    }
    
    // -----------------------------------------------
    // 4. Audio: Mashari Rashed Al-Afasy (using standard CDN)
    //    pattern: https://cdn.islamic.network/quran/audio/128/ar.alafasy/xxx.mp3 where xxx = 3-digit surah + 3-digit ayah
    // -----------------------------------------------
    function getAudioUrl(surah, ayah) {
        const surahPadded = surah.toString().padStart(3, '0');
        const ayahPadded = ayah.toString().padStart(3, '0');
        return `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${surahPadded}${ayahPadded}.mp3`;
    }
    
    let audioPlayer = null;
    let currentAudioIndex = 0;
    let versesAudioQueue = [];
    
    function stopCurrentAudio() {
        if (audioPlayer) {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            audioPlayer = null;
        }
    }
    
    function playVersesSequentially(verses) {
        stopCurrentAudio();
        if (!verses || verses.length === 0) return;
        versesAudioQueue = [...verses];
        currentAudioIndex = 0;
        playNextVerseAudio();
    }
    
    function playNextVerseAudio() {
        if (currentAudioIndex >= versesAudioQueue.length) {
            // finished
            audioPlayer = null;
            return;
        }
        const verse = versesAudioQueue[currentAudioIndex];
        const url = getAudioUrl(verse.surah, verse.ayah);
        const audio = new Audio(url);
        audioPlayer = audio;
        audio.addEventListener('ended', () => {
            currentAudioIndex++;
            playNextVerseAudio();
        });
        audio.addEventListener('error', (e) => {
            console.warn("Audio error for verse", verse, e);
            currentAudioIndex++;
            playNextVerseAudio(); // skip if error
        });
        audio.play().catch(err => console.warn("Audio play blocked:", err));
    }
    
    // -----------------------------------------------
    // 5. Blockchain interaction (Base)
    // -----------------------------------------------
    let provider, signer, contract;
    let userAddress = null;
    
    async function initBlockchain() {
        if (window.ethereum) {
            provider = new ethers.BrowserProvider(window.ethereum);
            try {
                const network = await provider.getNetwork();
                if (Number(network.chainId) !== 8453) {
                    document.getElementById("txStatus").innerHTML = "⚠️ Please switch network to Base Mainnet (ChainId 8453)";
                    return false;
                }
                signer = await provider.getSigner();
                userAddress = await signer.getAddress();
                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                document.getElementById("walletStatus").innerHTML = `🟢 Connected: ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                return true;
            } catch (e) {
                document.getElementById("walletStatus").innerHTML = "❌ Wrong network / no account";
                return false;
            }
        } else {
            document.getElementById("walletStatus").innerHTML = "🦊 Install MetaMask to use Base";
            return false;
        }
    }
    
    async function requestBaseNetwork() {
        if (!window.ethereum) return false;
        try {
            await window.ethereum.request({
                method: 'wallet_addEthereumChain',
                params: [{
                    chainId: BASE_CHAIN_ID,
                    chainName: 'Base Mainnet',
                    nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                    rpcUrls: ['https://mainnet.base.org'],
                    blockExplorerUrls: ['https://basescan.org']
                }]
            });
            return true;
        } catch (err) {
            console.error(err);
            return false;
        }
    }
    
    // Main flow: trigger transaction -> after confirmation -> get random triplet and display + show listen
    async function onReadVerses() {
        if (!window.ethereum) {
            alert("Please install MetaMask to use this Quran reader.");
            return;
        }
        let isConnected = false;
        try {
            const accounts = await window.ethereum.request({ method: 'eth_accounts' });
            if (accounts.length === 0) {
                await window.ethereum.request({ method: 'eth_requestAccounts' });
            }
            const net = await window.ethereum.request({ method: 'eth_chainId' });
            if (net !== BASE_CHAIN_ID) {
                const switched = await requestBaseNetwork();
                if (!switched) throw new Error("Please switch to Base Mainnet manually");
            }
            const initOk = await initBlockchain();
            if (!initOk || !contract) throw new Error("Blockchain init failed");
        } catch (err) {
            document.getElementById("txStatus").innerHTML = `⚠️ ${err.message}`;
            return;
        }
        
        // Show loading
        document.getElementById("loadingMessage").style.display = "block";
        document.getElementById("versesDisplay").style.display = "none";
        document.getElementById("txStatus").innerHTML = "⏳ Sending transaction on Base blockchain...";
        
        try {
            const tx = await contract.readThreeVerses();
            document.getElementById("txStatus").innerHTML = `⛓️ Transaction sent: ${tx.hash.slice(0,18)}... Waiting confirmation`;
            const receipt = await tx.wait();
            document.getElementById("txStatus").innerHTML = `✅ Confirmed! Block: ${receipt.blockNumber} | Total reads increased.`;
            
            // After on-chain confirmation -> generate rare triple consecutive verses
            const triplet = getRandomConsecutiveTriplet();
            await displayTripletVerses(triplet);
            // store triplet for listen
            window.currentDisplayedVerses = triplet;
            document.getElementById("versesDisplay").style.display = "block";
            document.getElementById("loadingMessage").style.display = "none";
            
            // auto-scroll to verses
            document.getElementById("versesDisplay").scrollIntoView({ behavior: "smooth" });
        } catch (error) {
            console.error(error);
            document.getElementById("txStatus").innerHTML = `❌ Transaction failed: ${error.message.slice(0, 100)}`;
            document.getElementById("loadingMessage").style.display = "none";
        }
    }
    
    // -----------------------------------------------
    // 6. Event listeners & initial UI
    // -----------------------------------------------
    document.addEventListener("DOMContentLoaded", async () => {
        const readBtn = document.getElementById("readVersesBtn");
        const listenBtn = document.getElementById("listenBtn");
        
        readBtn.addEventListener("click", onReadVerses);
        listenBtn.addEventListener("click", () => {
            if (window.currentDisplayedVerses && window.currentDisplayedVerses.length === 3) {
                playVersesSequentially(window.currentDisplayedVerses);
            } else {
                alert("Please read 3 verses first by confirming a Base transaction.");
            }
        });
        
        // attempt initial connection check but not mandatory
        if (window.ethereum) {
            const chain = await window.ethereum.request({ method: 'eth_chainId' }).catch(()=>null);
            if (chain === BASE_CHAIN_ID) {
                await initBlockchain();
            } else {
                document.getElementById("walletStatus").innerHTML = "🌐 Connect to Base Mainnet";
            }
        } else {
            document.getElementById("walletStatus").innerHTML = "🦊 MetaMask required";
        }
        
        // small preview info
        document.getElementById("txStatus").innerHTML = "✨ Click 'Read 3 Verses' → trigger Base transaction → reveal blessed verses";
    });
    
    // ensure ABI function contract placeholder warning if not deployed yet
    console.log("Ready | Contract address:", CONTRACT_ADDRESS);
</script>
</body>
</html>
